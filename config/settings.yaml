# How_To_Become_Warren_Buffett — 매매 설정 (비밀값 아님 · 저장소에 올라간다)
# 숫자를 바꾸면 docs/DECISIONS.md 에 이유를 한 줄 남긴다.

mode:
  # shadow: 모든 단계를 실제처럼 돌리되 주문만 보내지 않는다 (기록 · 알림은 남긴다)
  # live  : 실제 주문. run_live.py 는 --mode live 와 아래 live_enabled: true 가 **둘 다** 있어야 주문한다
  live_enabled: false

capital:
  budget_usd: 100.0            # 이 프로그램이 쓸 최대 금액. 토스 USD 매수가능금액과 둘 중 작은 값
  slots: 3                     # 3칸 (사용자 2026-11-19): 칸 하나 = 자금의 1/3 로 한 종목 · 3칸 모두 보유 중이면 매수 안 함
                               # 이전 프로그램의 '다음 영업일까지 칸 잠금'은 쓰지 않는다 (토스는 해당 없음 · 사용자)
  # 토스 Open API 주문은 자동 환전하지 않는다 (FAQ) → 미리 앱에서 달러로 바꿔 둔다

universe:                      # 종목 범위 (사용자 결정 2026-11-18: 이전 U1 의 시가총액 기준만 · 거래량 조건 뺌)
  min_market_cap_usd: 5_000_000
  max_market_cap_usd: 300_000_000
  markets: [NASDAQ, NYSE, AMEX]
  security_types: [STOCK, FOREIGN_STOCK, DEPOSITARY_RECEIPT]
  common_share_only: true

news:
  max_alert_age_s: 120         # 발행 뒤 이보다 늦게 받은 알림은 매수 판단을 하지 않는다 (재시작 직후 옛 기사 방지)
  body_max_chars: 6000         # AI 에 넣는 본문 길이 상한

jev:                           # 1단계: 최소 컷 (쓰레기만 거른다)
  model: typesafe/jev-1.13     # OpenRouter 문서에서 확인된 고정 버전 (2026-11-18)
  pass_choices: [small_positive, big_positive]   # 이 둘이면 confidence 와 상관없이 Claude 로 보낸다

claude:                        # 2단계: 메인 판단 + 매수 근거 리포트
  model: anthropic/claude-opus-5.5
  reasoning_effort: low        # 속도 우선 (뉴스 매매는 초 단위)
  max_tokens: 1800
  timeout_s: 60

entry:                         # 매수 (사용자 2026-11-19): Claude BUY 뒤 '뉴스 발행부터 5분 안에 +5%' 면 한 번에 매수
  trigger_window_min: 5        # 뉴스 발행 시각부터 이 시간 안에서만
  trigger_rise_pct: 5.0        # 기준가 대비 이만큼 오르면 매수 신호
  trigger_max_rise_pct: 10.0   # 상한 (사용자 2026-11-23 · 임시): 이보다 높으면 사지 않고 5분 안에 구간으로 돌아오는지 본다
                               #   → KNIME 결정트리(sim_entry_rise_pct)로 다시 정한다 · null = 상한 없음
  ref_max_age_min: 30          # 기준가 = 발행 전에 끝난 마지막 1분봉 종가 (이보다 낡았으면 발행 뒤 첫 체결가)
  limit_premium_pct: 0.7       # 지정가 = 신호 가격 × 1.007 (이전 프로그램)
  fill_timeout_s: 5            # 이 시간 안에 안 채워진 잔량은 취소 (토스에는 IOC 가 없다)
  poll_interval_s: 1.0         # 신호를 기다리는 동안 가격 확인 주기
  decision_delay_s: 60         # 과거 시뮬레이션(KNIME 라벨)에서 AI 판단에 걸린다고 보는 시간

exit:                          # 매도 = 이전 프로그램 position_monitor 그대로 (D-154 (5))
  stop_loss_pct: -7.0          # ① 손익 ≤ −7% → 전량 (진입 직후에도)
  grace_s: 30                  #    진입 30초 안에는 ①만 본다
  time_stops:                  # ② (분, 최소 손익%) — 그 시간이 지났는데 손익이 이보다 낮으면 전량 (긴 것부터 본다)
    - [15, 5.0]
    - [5, 2.0]
  take_profits:                # ③ (손익%, 원수량 비율) — 한 번 점검에 높은 단계부터 하나씩
    - [15.0, 0.3]              #    TP3: 30% + 트레일링 켬
    - [10.0, 0.3]              #    TP2: 30%
    - [5.0, 0.3]               #    TP1: 30%
  trail_pct: 5.0               # ④ 트레일링: 고점 대비 −5% → 남은 물량 (나머지 10%)
  trail_open_pct: 3.0          #    ET 09:25~09:35 (정규장 개장 전후) 에는 −3%
  session_close_buffer_min: 5  # 애프터마켓 끝나기 5분 전 → 전량
  limit_slippage_pct: 2.0      # 매도 지정가 = 매수1호가 × (1 − 2%) (장외는 지정가만 → 체결 우선)
  fill_timeout_s: 10           # 매도 미체결이면 가격을 고쳐 다시 (최대 reprice_max 번)
  reprice_max: 5
  poll_interval_s: 1.0         # 보유 중 가격 확인 주기 (토스 MARKET_DATA 한도 초당 15)

risk:                          # 안전장치 — 금액이 아니라 % 기준 (사용자 2026-11-19 · 이전 risk_manager: 3연패 · 일 −10%)
  daily_loss_limit_pct: 10.0   # 그날(KST 10:00 시작 · report.daily_time_kst) 시작 자산 대비 실현손실 −10% → 그날 신규 매수 중단
  max_consecutive_losses: 3    # 3연패 → 그날 신규 매수 중단
  max_drawdown_pct: 40.0       # 시작 자금(capital.budget_usd) 대비 자산 −40% → 시스템 정지 (사람이 풀 때까지)
  one_trade_per_ticker_per_day: true   # 같은 종목은 미국 날짜 하루에 한 번만 (이전 프로그램)

reconcile:                     # 시작 점검 (D-14): 기록에 없는 미국 주식 보유 · 모르는 미체결 주문 → 신규 매수 멈춤 + #critical
  ignore_symbols: []           # 같은 계좌에 직접 들고 있는 종목이 있으면 여기에 (예: [AAPL])

sessions:                      # 사용자 결정: 프리마켓 · 정규장 · 애프터마켓 모두 (토스 데이마켓은 제외)
  trade_premarket: true
  trade_regular: true
  trade_aftermarket: true
  trade_daymarket: false

fees:
  # 백필 라벨 계산용 기본값. 실거래는 토스 /api/v1/commissions 응답을 쓴다
  commission_rate_default: 0.001

report:
  # 하루 경계 = 일일 보고서 시각 = 하루 손실 · 연패 리셋 (사용자 2026-11-23: 09:00 → 10:00)
  # 토스 애프터마켓이 겨울(표준시) KST 09:50 에 끝나서 09:00 이면 장 중간에 하루가 끊긴다. 정각만 된다 (분은 00).
  daily_time_kst: "10:00"
  tz: Asia/Seoul

paths:
  data_dir: data               # .gitignore 대상
  log_dir: logs
